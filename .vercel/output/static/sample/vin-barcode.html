<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample VIN Barcode · RV Fox</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; font-family: system-ui, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; text-align: center; }
    h1 { font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .vin { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.12em; margin: 12px 0 20px; font-family: ui-monospace, monospace; }
    img { width: 100%; height: auto; image-rendering: pixelated; }
    p { color: #444; font-size: 0.9rem; line-height: 1.4; }
  </style>
</head>
<body>
  <main>
    <h1>Sample VIN barcode</h1>
    <p class="vin">1FTFW1ET5DFC10312</p>
    <p>Open this page on a laptop or second phone. In RV Fox → RvFACTS → VIN Decoder → Scan, then point at the codes below.</p>
    <img src="/assets/sample-vin-barcode.png" alt="Sample VIN barcodes CODE128 CODE39 QR" />
  </main>
</body>
</html>
